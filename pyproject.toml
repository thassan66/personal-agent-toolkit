[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-toolkit"
version = "0.1.0"
description = "Independent personal agent toolkit for local automation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Taimoor Hassan" }]
dependencies = []

[project.scripts]
personal-agent-toolkit = "personal_agent_toolkit.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["personal_agent_toolkit*"]
